<html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous" />
<!-- gif.js for GIF export (with worker bundled) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script type="module">
    import { AutoTokenizer } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers/dist/transformers.js'
    window.AutoTokenizer = AutoTokenizer;
</script>
<script type="module" src="dist/main.js"></script>

<head>
    <title>WebGPU-Based Video Generation</title>
</head>

<style>
    .onerow {
        display: flex;
    }
</style>

<body data-bs-theme="dark">
    <div class="container">
        <div class="row pt-3">
            <div class="col-md-9 col-12">
                <h2>WebGPU-Based Video Generation</h2>
            </div>
        </div>
        <div class="container p-2 card" id="input-area">
            <div class="input-group">
                <textarea class="form-control" id="user-input" placeholder="Type your question here..."></textarea>
                <button id="send-button" class="btn btn-primary">Send</button>
            </div>
        </div>
        <div id="image_area">
            <h5 style="margin-top: 10px; color: #aaa;">Generated Frames:</h5>
            <div class="onerow">
                <div id="img_div_0" style="margin-right: 4px;">
                    <canvas id="img_canvas_0"></canvas>
                </div>
                <div id="img_div_1" style="margin-right: 4px;">
                    <canvas id="img_canvas_1"></canvas>
                </div>
                <div id="img_div_2" style="margin-right: 4px;">
                    <canvas id="img_canvas_2"></canvas>
                </div>
                <div id="img_div_3" style="margin-right: 4px;">
                    <canvas id="img_canvas_3"></canvas>
                </div>
            </div>
            <div class="onerow" style="margin-top: 4px;">
                <div id="img_div_4" style="margin-right: 4px;">
                    <canvas id="img_canvas_4"></canvas>
                </div>
                <div id="img_div_5" style="margin-right: 4px;">
                    <canvas id="img_canvas_5"></canvas>
                </div>
                <div id="img_div_6" style="margin-right: 4px;">
                    <canvas id="img_canvas_6"></canvas>
                </div>
                <div id="img_div_7" style="margin-right: 4px;">
                    <canvas id="img_canvas_7"></canvas>
                </div>
            </div>
            <div class="onerow" style="margin-top: 4px;">
                <div id="img_div_8" style="margin-right: 4px;">
                    <canvas id="img_canvas_8"></canvas>
                </div>
                <div id="img_div_9" style="margin-right: 4px;">
                    <canvas id="img_canvas_9"></canvas>
                </div>
                <div id="img_div_10" style="margin-right: 4px;">
                    <canvas id="img_canvas_10"></canvas>
                </div>
                <div id="img_div_11" style="margin-right: 4px;">
                    <canvas id="img_canvas_11"></canvas>
                </div>
            </div>
            <div class="onerow" style="margin-top: 4px;">
                <div id="img_div_12" style="margin-right: 4px;">
                    <canvas id="img_canvas_12"></canvas>
                </div>
                <div id="img_div_13" style="margin-right: 4px;">
                    <canvas id="img_canvas_13"></canvas>
                </div>
                <div id="img_div_14" style="margin-right: 4px;">
                    <canvas id="img_canvas_14"></canvas>
                </div>
                <div id="img_div_15" style="margin-right: 4px;">
                    <canvas id="img_canvas_15"></canvas>
                </div>
            </div>
        </div>
        
        <div id="video_area" style="margin-top: 20px;">
            <h5 style="color: #aaa;">Generated Video:</h5>
            <div id="video_container" style="display: inline-block; background: #222; padding: 10px; border-radius: 8px;">
                <p style="color: #666; margin: 20px;">Video will appear here after frames are generated...</p>
            </div>
        </div>
        <p class="text-lg-start">
        <div id="status" style="font: 1em consolas;"></div>
        </p>
    </div>
</body>

</html>
